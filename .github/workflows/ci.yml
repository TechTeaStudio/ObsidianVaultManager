name: CI

# Checks a pull request before it reaches product. A push to product runs release.yml, which repeats
# these checks before it publishes, so they are not run twice for one push.
on:
  pull_request:
    branches: ["product"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: >
          dotnet test tests/VaultManager.Tests/VaultManager.Tests.csproj
          -c Release
          -nologo
          -v:minimal

  build:
    name: Build ${{ matrix.tfm }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net6.0
            sdk: 6.0.x
          - tfm: net8.0
            sdk: 8.0.x
          - tfm: net9.0
            sdk: 9.0.x
          - tfm: net10.0
            sdk: 10.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The sources use C# 12, so net6.0 and the others still need a current compiler.
      - name: Setup .NET ${{ matrix.sdk }} and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ matrix.sdk }}
            10.0.x

      - name: Build ${{ matrix.tfm }}
        run: >
          dotnet build src/VaultManager.App/VaultManager.App.csproj
          -c Release
          -f ${{ matrix.tfm }}
          -nologo
          -v:minimal
